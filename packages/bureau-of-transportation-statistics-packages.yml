source: >-
  npm, PyPI, RubyGems, CRAN and the dotbts GitHub organization, searched 2026-09-05
note: >-
  THE BUREAU OF TRANSPORTATION STATISTICS PUBLISHES NO CLIENT LIBRARY. Its GitHub
  organization (https://github.com/dotbts) holds exactly one public repository — BPA, the
  General Active Transportation Infrastructure Specification (GATIS) — which is a data
  specification, not an SDK. Every package below is a THIRD-PARTY client for the Socrata
  SODA platform that data.bts.gov runs on, or a third-party wrapper of the BTS portal.
  None is first-party, so official is false on every entry and NO `SDKs` pointer is
  emitted in apis.yml. Recorded here because they are what an integrator will actually
  reach for, and because their release dates are the strongest available decay signal:
  the JavaScript client last shipped in 2017, the Ruby client in 2020, the Python client
  in 2022, all against a live API BTS still updates daily.
official_sdk_count: 0
