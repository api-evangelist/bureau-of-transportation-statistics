description: >-
  THE BUREAU OF TRANSPORTATION STATISTICS PUBLISHES NO PLANS AND CHARGES NOTHING. Every
  surface is a public federal open-data API: data.bts.gov (SODA/OData), geodata.bts.gov
  (NTAD geospatial, OGC API) and www.transtats.bts.gov. There is no pricing page, no
  paid tier, no metered quota and no billing relationship of any kind. The only signup is
  a free developer registration at
  https://data.bts.gov/profile/edit/developer_settings which issues an X-App-Token; the
  token is not a licence and buys no quota — it moves the caller out of the shared
  anonymous throttling pool. Data is released as a U.S. Government Work
  (https://www.usa.gov/government-works), free of copyright and free of charge.
