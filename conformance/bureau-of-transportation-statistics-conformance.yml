    file: conformance/bureau-of-transportation-statistics-geodata-conformance.json
  - id: odata-v4
    name: OASIS OData 4.0
    conforms: true
    domain_standard: true
    evidence: >-
      https://data.bts.gov/api/odata/v4/$metadata returns a CSDL/EDMX 4.0 document
      (edmx:Edmx Version="4.0", OASIS namespace) declaring 184 EntityTypes and 184
      EntitySets, one per tabular BTS dataset; a dataset feed at
      https://data.bts.gov/api/odata/v4/bw6n-ddqk returns @odata.context. HTTP 200,
      fetched 2026-09-05.
    file: odata/bureau-of-transportation-statistics-odata-metadata.xml
  - id: dcat-us-1.1
    name: Project Open Data / DCAT-US 1.1
    conforms: true
    domain_standard: true
    evidence: >-
      https://data.bts.gov/data.json returns a dcat:Catalog with
      conformsTo https://project-open-data.cio.gov/v1.1/schema and 418 datasets (HTTP 200);
      https://geodata.bts.gov/api/feed/dcat-us/1.1.json returns the same shape with 142
      NTAD datasets. Required by OMB M-13-13 for federal agencies.
  - id: dcat-rdf
    name: DCAT (W3C) RDF/XML serialization
    conforms: true
    evidence: >-
