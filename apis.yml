description: The Bureau of Transportation Statistics (BTS), part of the Department of Transportation (DOT)
  is the preeminent source of statistics on commercial aviation, multimodal freight activity, and transportation
  economics, and provides context to decision makers and the public for understanding statistics on transportation.
