    name: OGC API - Common Part 1 Core
    conforms: true
    evidence: >-
      https://geodata.bts.gov/api/search/v1/conformance declares
      http://www.opengis.net/spec/ogcapi-common-1/1.0/conf/core and .../conf/json
    file: conformance/bureau-of-transportation-statistics-geodata-conformance.json
