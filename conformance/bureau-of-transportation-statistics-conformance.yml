generated: '2026-09-05'
method: searched
source: https://geodata.bts.gov/api/search/v1/conformance
note: >-
  Conformance for the Bureau of Transportation Statistics API surface. BTS runs three
  first-party machine-readable surfaces on hosts it controls: data.bts.gov (Socrata /
  Tyler Data & Insights SODA 2.1 + OData 4.0 + Project Open Data DCAT-US 1.1),
  geodata.bts.gov (ArcGIS Hub, OGC API - Records/Features + a first-party OpenAPI 3.0),
  and www.transtats.bts.gov (HTML query forms, no machine contract). Every entry below
  carries the exact URL that was fetched on 2026-09-05. Platform-level conformance is
  labelled as such — the class URIs are served BY BTS's own hosts, but the implementation
  belongs to the hosting platform (Tyler Data & Insights, Esri ArcGIS Online).
standards:
