  humanURL: https://geodata.bts.gov/
  baseURL: https://geodata.bts.gov
  description: >-
    The search and catalog API behind Geospatial at the Bureau of Transportation Statistics,
    the home of the National Transportation Atlas Database (NTAD). It is a conformant OGC
    API - Records implementation: the landing page at /api/search/v1 advertises a
    conformance document declaring nine opengis.net classes across OGC API - Common Parts 1
    and 2, OGC API - Features Part 1 and OGC API - Records Part 1, and a service-desc link
    to a first-party OpenAPI 3.0 definition with 17 operations. Catalog records resolve to
    1,079 live ArcGIS FeatureServer layers plus GeoJSON, CSV, Shapefile, KML and GeoPackage
    downloads. Anonymous, free, read-only.
  properties:
  - type: OpenAPI
    url: openapi/bureau-of-transportation-statistics-geodata-search-openapi.json
  - type: APIReference
    url: https://geodata.bts.gov/api/search/definition/
  - type: Portal
    url: https://geodata.bts.gov/
  - type: Conformance
    url: conformance/bureau-of-transportation-statistics-geodata-conformance.json
  - type: DataCatalog
    url: https://geodata.bts.gov/api/feed/dcat-us/1.1.json
    name: DCAT-US 1.1 catalog — 142 NTAD datasets
  - type: Overlay
    url: overlays/bureau-of-transportation-statistics-geodata-search-overlay.yaml
  features:
  - OGC API - Records
  - OGC API - Features
  - GeoJSON Output
  - Full-Text and Queryable Catalog Search
  - ArcGIS GeoServices REST Feature Layers
  - Bulk DCAT-US 1.1 Feed
  useCases:
  - Transportation infrastructure mapping
  - Freight corridor and network analysis
  - Geospatial data discovery
  - Open data cataloging
