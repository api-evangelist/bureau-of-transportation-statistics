note: >-
  Derived from $ref edges in the harvested specs and from the OData CSDL. TWO THINGS ARE
  TRUE OF THIS PROVIDER AND SHAPE THE WHOLE MODEL. First, the row-level payload is
  UNTYPED: the SODA specs describe every dataset row as an object with
  additionalProperties: true, because each of the 418 datasets has its own columns. The
  per-dataset schema is not in any OpenAPI — it is retrievable at runtime, one dataset at a
  time, from GET /api/views/{datasetId}.json, and the union of all tabular schemas is the
  OData CSDL at /api/odata/v4/$metadata, which types 184 EntityTypes explicitly. Second,
  the entity model that IS statically typed is the CATALOG, not the data: the geodata
  search API models collections, records and feature layers. Identity across every surface
  is the Socrata four-by-four (^[a-z0-9]{4}-[a-z0-9]{4}$).
identifiers:
  - name: four-by-four
    pattern: '^[a-z0-9]{4}-[a-z0-9]{4}$'
    example: bw6n-ddqk
    used_by:
      - /resource/{datasetId}.json
      - /api/views/{datasetId}.json
      - /api/odata/v4/{datasetId}
    note: >-
      One id addresses the same asset across SODA, metadata and OData. It is also the
      EntitySet Name in the CSDL, so the OData entity set for a dataset is literally its
      four-by-four.
  - name: arcgis-item-id
    pattern: '^[0-9a-f]{32}$'
    example: 9010c04bcdf84c36abb74e98778af579
    used_by:
      - /api/search/v1/collections/{collectionId}/items/{itemId}
      - /api/download/v1/items/{itemId}/{format}
    note: The geospatial catalog keys on ArcGIS item ids, not on four-by-fours.
entities:
  - name: Dataset
    surface: data.bts.gov
    count: 418
    source: https://data.bts.gov/data.json
    described_by: /api/views/{datasetId}.json
    note: >-
      Of these, 184 are tabular and therefore appear as OData EntityTypes; the remainder are
      stories, maps, filtered views and other non-tabular assets, which return HTTP 403
      "no row or column access to non-tabular tables" from /resource/.
  - name: Row
    surface: data.bts.gov
    typed: false
    note: >-
      additionalProperties: true in the OpenAPI. The real column list per dataset comes from
      /api/views/{datasetId}.json (columns[]) or from the CSDL EntityType of the same name.
  - name: OdataEntityType
    surface: data.bts.gov
    count: 184
    source: odata/bureau-of-transportation-statistics-odata-metadata.xml
    key: __id
    note: >-
      Every EntityType declares a Key of __id (Socrata's synthetic row id, e.g.
      row-hsjj_k39w.gbwr) plus one Property per dataset column with a real EDM type.
  - name: Catalog
    surface: geodata.bts.gov
